name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: false

      - name: Checkout submodules (full depth, private access)
        run: git submodule update --init --recursive
        env:
          GIT_CONFIG_GLOBAL: /tmp/gitconfig
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://${{ secrets.GH_PAT }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/

      # Everything in this repository is world-readable on github.com as well as
      # on classes.incortx.com, and Cloudflare Access only gates the website. So
      # the answer files have to be stopped here, before they are ever committed
      # and served. Added 2026-09-08, when the course content stopped being a
      # private submodule and became files in this repo.
      - name: Refuse to publish instructor-only files
        run: |
          bad=$(git ls-files | grep -iE '(^|/)(exercise_key|exercises|solutions?|answers?|_key)[^/]*\.(html|ipynb|md|pdf)$' || true)
          tok=$(git grep -lE 'gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}' -- . || true)
          if [ -n "$bad$tok" ]; then
            echo "::error::refusing to deploy — instructor-only or secret-looking content:"
            [ -n "$bad" ] && echo "$bad"
            [ -n "$tok" ] && echo "$tok"
            exit 1
          fi
          echo "publish guard: clean"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
